server.port=8083
spring.application.name=order-service
backend.menu.service.url=${BACKEND_MENU_SERVICE_URL}

################## datasource ##################
spring.datasource.url=${DB_USER_DB_URL}
spring.datasource.username=${DB_USER_DB_USERNAME}
spring.datasource.password=${DB_USER_DB_PASSWORD}

################## jpa ##################
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

################## line pay ##################
#line.pay.store.id=${LINE_PAY_STORE_ID}
line.pay.channel.id=${LINE_PAY_CHANNEL_ID}
line.pay.channel.secret=${LINE_PAY_CHANNEL_SECRET}

################## frontend ##################
frontend.url=${FRONTEND_URL}