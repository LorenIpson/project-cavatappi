server.port=8081
spring.application.name=user-service

################## datasource ##################
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_USER_DB_URL:jdbc:postgresql://localhost:5432/user_db}
spring.datasource.username=${DB_USER_DB_USERNAME:user}
spring.datasource.password=${DB_USER_DB_PASSWORD:lorenipson}

################## jpa ##################
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

################## security ##################
#spring.security.oauth2.client.registration.github.client-id=${OAUTH_USER_GITHUB_CLIENT_ID}
#spring.security.oauth2.client.registration.github.client-secret=${OAUTH_USER_GITHUB_CLIENT_SECRET}

spring.security.oauth2.client.registration.google.client-id=${OAUTH_USER_GOOGLE_CLIENT_ID:google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH_USER_GOOGLE_CLIENT_SECRET:google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_LOGIN_REDIRECT_URL:http://localhost:8080/login/oauth2/code/google}
spring.security.oauth2.client.registration.google.client-name=Google

# 1.    The login endpoint (e.g. /oauth2/authorization/my-oidc-client(github)) is used to initiate login and perform a
#       redirect to the third party authorization server.
# 2.    The redirection endpoint (e.g. /login/oauth2/code/my-oidc-client(github)) is used by the authorization server to
#       redirect back to the client application, and will contain a code parameter used to
#       obtain an id_token and/or access_token via the access token request.

################## jwt ##################
jwt.secret-key=${JWT_SECRET_KEY:123456789012345678901234567890abc}
jwt.secret-key.valid.seconds=${JWT_KEY_VALID_SECONDS:6000}

################## validation mail ##################
spring.mail.host=${SMTP_HOST:smtp.example.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:test@example.com}
spring.mail.password=${SMTP_PASSWORD:password}
spring.mail.properties.transport.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

################## debug ##################
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.mail=DEBUG
logging.level.org.springframework.session.web.http.SessionRepositoryFilter.SESSION_LOGGER=DEBUG

################## frontend ##################
frontend.url=${FRONTEND_URL:http://localhost:3000}